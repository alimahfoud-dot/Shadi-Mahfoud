<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates</title> 
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }
        
        .container {
            display: flex;           /* هذا اللي يخليهم جنب بعض */
            gap: 15px;               /* مسافة بين الصورتين */
            justify-content: center; /* يوسط الصورتين في الصفحة */
            flex-wrap: wrap;         /* لو الشاشة صغيرة ينزلو تحت بعض */
        }
        
        .container img {
            width: 45%;              /* كل صورة تقريباً نص الصفحة */
            max-width: 700px;        /* أقصى عرض للصورة */
            height: auto;            /* يحافظ على نسبة الصورة */
            border-radius: 8px;      /* حواف مدورة (اختياري) */
            box-shadow: 0  0 4px 10px rgba(0,0,0,0.1);
            border-style: dashed; /* ظل خفيف (اختياري) */
        }
        .Jishi{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
         .Jishi img{
           width: 45%;;
         max-width: 700px;
         border-style: dashed;
         border-color: #444;
            margin-top: 30px;
            border-radius: 10px;
             box-shadow: 0  0 4px 10px rgba(0,0,0,0.1);
        }
        .title {
            text-align: center;
            font-family: sans-serif;
            font-style: italic;
            font-weight: 500;
            font-size: 50px;
            background-color:antiquewhite;
            color: #444;
        }
        
@media (max-width: 1200px) {
    body {
          
        zoom: 0.8; 
    }
}

@media (max-width: 992px) {
    body {
        zoom: 0.7;
    }
}

@media (max-width: 768px) {
    body {
        zoom: 0.5;  
    }
}

@media (max-width: 480px) {
    body {
        zoom: 0.35; 
        overflow-x: hidden; 
    }
}
    </style>
</head>
<body>
    <h1 class="title">Certificates</h1>

<div class="Jishi">
